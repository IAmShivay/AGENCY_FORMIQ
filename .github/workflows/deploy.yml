name: Deploy Agency to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  VPS_HOST: ${{ secrets.VPS_HOST }}
  VPS_USER: ubuntu
  APP_DIR: /home/ubuntu/agency

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Fetch build secrets from Infisical
        uses: Infisical/secrets-action@v1.0.7
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: formiqstudio-project-jk-zk
          env-slug: prod
          secret-path: /agency

      - run: npm ci

      - name: Build Next.js
        run: npm run build

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: |
            .next/
            public/
            package.json
            package-lock.json
            next.config.js

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: nextjs-build
          path: build/

      - name: Fetch runtime secrets from Infisical
        uses: Infisical/secrets-action@v1.0.7
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: formiqstudio-project-jk-zk
          env-slug: prod
          secret-path: /agency
          export-type: file
          file-output-path: .env.agency

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ env.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy
        run: |
          rsync -avz --delete \
            build/.next/ \
            ${{ env.VPS_USER }}@${{ env.VPS_HOST }}:${{ env.APP_DIR }}/.next/

          rsync -avz \
            build/public/ \
            ${{ env.VPS_USER }}@${{ env.VPS_HOST }}:${{ env.APP_DIR }}/public/

          rsync -avz \
            build/package.json \
            build/package-lock.json \
            build/next.config.js \
            ${{ env.VPS_USER }}@${{ env.VPS_HOST }}:${{ env.APP_DIR }}/

      - name: Deploy .env and restart
        run: |
          scp .env.agency ${{ env.VPS_USER }}@${{ env.VPS_HOST }}:${{ env.APP_DIR }}/.env

          ssh ${{ env.VPS_USER }}@${{ env.VPS_HOST }} << 'EOF'
            cd /home/ubuntu/agency
            npm ci --omit=dev

            if pm2 describe agency > /dev/null 2>&1; then
              pm2 restart agency
            else
              NODE_OPTIONS="--max-old-space-size=256" pm2 start npm \
                --name agency \
                --max-memory-restart 200M \
                -- start -- -p 3001
            fi

            pm2 save
          EOF

      - name: Verify
        run: |
          sleep 5
          ssh ${{ env.VPS_USER }}@${{ env.VPS_HOST }} "pm2 status"
